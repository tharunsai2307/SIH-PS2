version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: isense_postgres
    environment:
      POSTGRES_USER: isense
      POSTGRES_PASSWORD: isense_secret
      POSTGRES_DB: isense_db
    ports:
      - "5432:5432"
    volumes:
      - isense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isense -d isense_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isense_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://isense:isense_secret@postgres:5432/isense_db
      SYNC_DATABASE_URL: postgresql://isense:isense_secret@postgres:5432/isense_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isense_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  isense_pgdata:
